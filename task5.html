<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TASK5</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
        <link rel="stylesheet" href="task5.css">
    </head>
    <body>
        <div class="container">

            <!-- Balance Container -->
            <header class="top-card">
                <div class="balance">
                    <h3 class="balance-title"> my Balance</h3>
                    <p class="balance-amount">$921.48 </p>
                </div>
                <!-- Circle  -->
                <div class="circle-light">
                </div>
                <div class="circle-dark ">
                </div>
                <!-- </div> -->

            </header>
            <section class="spending-card">
            
                <div class="spending">
                    <h3 class="spending-title">Spending - Last 7 days</h3>
                    <!-- Days Container -->
                    <div class="days">

                        <div class="mon"> <div class="bar1"></div><span>mon</span></div>
                        <div class="tue"> <div class="bar2"></div><span>tue</span> </div>
                        <div class="wed"> <div class="bar3"></div> <span>wed</span></div>
                        <div class="thu"> <div class="bar4"></div> <span>thu</span></div>
                        <div class="fri"><div class="bar5"></div><span>fri</span></div>
                        <div class="sat"> <div class="bar6"></div><span>sat</span></div>
                        <div class="sun"> <div class="bar7"></div><span>sun </span></div>


                    </div>

                    <!-- Total Container -->
                    <div class="total-card">
                    <div class="total">
                        <h3 class="total-title">Total this month</h3>
                        <p class="total-amount">$478.33</p>
                    </div>
                        <div class="total-change">
                            <h3 class="change-percentage">+2.4%</h3>
                            <p class="change-description">from last month</p>
                        </div>
                    </div>
                    </div>

                </div>
            </section>
        </div>

    </body>
</html>
